# FalconFox daemon config for a headless VPS.
# Copy to ~/.config/falconfox/config.toml and paste your token.

default_backend = "claude"

# Sessions holding a live agent subprocess at once. Each session runs its own
# ACP backend process, so this is a ceiling on host memory rather than on your
# work: a session over the limit is created *stored* and activates when a slot
# frees, evicting the least-recently-used idle session to make room. A working
# session is never evicted. 0 disables the cap.
#
# Sized for a small VPS. This daemon has been OOM-killed carrying ten sessions
# on a 951 MB host.
max_active_sessions = 5

default_always_allow = true

[backends.claude]
command = ["claude-agent-acp"]
# Generate with `claude setup-token` (on any machine — the OAuth step needs a
# browser, but the token is portable). Valid for one year; re-run to renew.
# NOTE: a stray ANTHROPIC_API_KEY in the environment would take precedence
# over this token and bill per-use — don't set one.
env = { CLAUDE_CODE_OAUTH_TOKEN = "paste-token-here" }

[backends.claude.config_options]
model = "opus"
mode = "auto"
effort = "high"
fast = "off"

# A second backend is how you get a second model. `env` is overlaid per
# backend, so ANTHROPIC_MODEL selects the model for sessions spawned with
# `falconfox spawn --backend fable` — verified working, and the variable does
# reach the ACP subprocess. Adding a backend needs no restart: POST /api/reload
# picks it up.
#
# Note the model is named exactly, unlike the coarse buckets
# (`model = "opus"`) the backend advertises over ACP.
#
# [backends.fable]
# command = ["claude-agent-acp"]
# env = { CLAUDE_CODE_OAUTH_TOKEN = "paste-token-here", ANTHROPIC_MODEL = "claude-fable-5" }
