[project]
name = "casebook"
version = "0.1.0"
description = "A small vendor-neutral ACP session daemon for remote agent work."
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "agent-client-protocol>=0.10.1",
    "starlette>=0.37",
    "uvicorn[standard]>=0.30",
    "watchfiles>=0.21",
]

[project.scripts]
falconfox = "casebook.cli:main"
falconfox-telegram = "falconfox_telegram.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/casebook", "src/falconfox_telegram"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist.hooks.custom]
path = "hatch_build.py"
